services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: weight2view
      POSTGRES_PASSWORD: weight2view
      POSTGRES_DB: weight2view
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weight2view"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://weight2view:weight2view@db:5432/weight2view
      APP_NAME: Weight2View API
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173
      # Bootstrap Super Admin - created idempotently on startup. Change
      # ADMIN_PASSWORD before running this anywhere but a local machine;
      # nothing here is a secret you'd want committed for real use.
      ADMIN_EMAIL: owner@weight2view.io
      ADMIN_PASSWORD: ChangeMe123!
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Requests are proxied through Vite's dev server (see
      # frontend/vite.config.ts) rather than called cross-origin directly,
      # so the admin session cookie works the same way it would behind a
      # single production reverse proxy. `backend` here is the other
      # service's name on the compose network.
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
